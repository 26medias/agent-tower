[package]
name = "tower-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tower_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
