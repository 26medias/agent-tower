[workspace]
resolver = "3"
members = ["crates/core", "crates/hook", "crates/fakecli", "src-tauri"]

[workspace.package]
version = "0.1.51"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
