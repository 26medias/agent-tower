[package]
name = "agent-tower"
version.workspace = true
description = "Agent Tower"
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the library name unique and different from the bin name.
name = "agent_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tower-core = { path = "../crates/core" }
serde = { workspace = true }
serde_json = { workspace = true }
